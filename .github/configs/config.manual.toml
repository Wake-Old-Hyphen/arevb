patches-version = "dev"
# cli-version = "dev"
enable-module-update = false

[gboard-morphe]
enabled = true
pkg-name = "com.google.android.inputmethod.latin"
app-name = "gboard"
rv-brand = "morphe"
build-mode = "both"
arch = "arm64-v8a"
patches-source = "jasonwu1994/Gboard-patches"
excluded-patches = "'Package Rename'"
cli-source = "MorpheApp/morphe-desktop"
uptodown-dlurl = "https://gboard-go.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/gboard"
dpi = "nodpi anydpi auto"
archive-dlurl = "https://archive.org/download/geologically/apks/com.google.android.inputmethod.latin"
github-dlurl = "https://github.com/nullcpy/apks/releases/tag/com.google.android.inputmethod.latin"

[gboard-morphe-clone]
enabled = true
pkg-name = "com.google.android.inputmethod.latin"
app-name = "gboard"
rv-brand = "morphe-clone"
build-mode = "apk"
arch = "arm64-v8a"
patches-source = "jasonwu1994/Gboard-patches"
cli-source = "MorpheApp/morphe-desktop"
uptodown-dlurl = "https://gboard-go.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/gboard"
dpi = "nodpi anydpi auto"
archive-dlurl = "https://archive.org/download/geologically/apks/com.google.android.inputmethod.latin"
github-dlurl = "https://github.com/nullcpy/apks/releases/tag/com.google.android.inputmethod.latin"

[tiktok-morphe-alt]
enabled = true
pkg-name = "com.zhiliaoapp.musically"
app-name = "tiktok"
rv-brand = "morphe-alt"
build-mode = "apk"
arch = "both"
patches-source = "hxreborn/hxreborn-tiktok-patches"
patches-version = "latest"
cli-source = "MorpheApp/morphe-desktop"
uptodown-dlurl = "https://tiktok.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/tiktok-pte-ltd/tik-tok-including-musical-ly"
dpi = "nodpi anydpi auto"
